# 签名测试包构建：手动触发，产出用自有 release 密钥签名的 APK，可覆盖手机上
# 由同一把密钥签名的旧版。构建段与 build-verify.yml 同构（接缝门禁 + 工具链 +
# 真实编译）；签名段复用 Dharness autonomous-release.yml 的剥离重签方法。
#
# 前置：fork 仓库 Settings → Secrets and variables → Actions 需配置：
#   RELEASE_KEYSTORE_B64   base64 编码的 release.jks（与手机现有版本同一把密钥）
#   RELEASE_STORE_PASSWORD 库口令（keytool 默认 PKCS12，私钥口令同值）
#   RELEASE_KEY_ALIAS      密钥别名
# 可选 Variables：
#   RELEASE_CERT_SHA256    证书 SHA-256 固定值，设置后强制比对
# 未配置密钥时签名 job 立即失败，不产出无签名或 debug 签名产物。
#
# 权限：contents: read；不写仓库、不发 release、不加 --beta、不接触其他仓库密钥。
# 产物为 workflow artifact（保留 7 天），供下载后覆盖安装验证，不对外发布。

name: signed-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.22.1

jobs:
  build:
    name: 接缝门禁 + 工具链 + APK 构建
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: 检出本仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node（接缝快照脚本运行时）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 接缝安全快照检查（构建前硬闸）
        run: python3 scripts/check_seam_security.py .

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/android-sdk
            ~/dev/flutter
            ~/dev/jdk-17
            ~/dev/.downloads
          key: toolchain-v1-${{ runner.os }}-${{ hashFiles('tooling/setup-toolchain.sh', 'runtime/build-runtime.sh', 'runtime/tawcroot/source.json') }}
          restore-keys: |
            toolchain-v1-${{ runner.os }}-

      - name: 安装工具链（NDK 随 source.json，禁用 emulator/system-image）
        run: |
          set -euo pipefail
          NDK_VER=$(python3 -c "import json; print(json.load(open('runtime/tawcroot/source.json'))['ndkVersion'])")
          echo "NDK 版本（来自 source.json）: $NDK_VER"
          sed -i -E "s|^NDK_VERSION=.*$|NDK_VERSION=\"${NDK_VER}\"|" tooling/setup-toolchain.sh
          sed -i 's/"emulator" "$SYSTEM_IMAGE"//g' tooling/setup-toolchain.sh
          sed -i 's/"emulator"//g' tooling/setup-toolchain.sh
          # 使用上游原样的下载参数，不做额外改写。
          bash tooling/setup-toolchain.sh
          source tooling/env.sh
          flutter --version
          java -version
          test -d "$ANDROID_HOME/ndk/${NDK_VER}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          sed -i -E 's/^([[:space:]]*)ndkVersion[[:space:]]*=[[:space:]]*flutter\.ndkVersion[[:space:]]*$/\1ndkVersion = "'"${NDK_VER}"'"/' app/android/app/build.gradle.kts
          grep -q "ndkVersion = \"${NDK_VER}\"" app/android/app/build.gradle.kts || {
            echo "Gradle ndkVersion 未固定到 ${NDK_VER}，终止以免多份 NDK"; exit 1; }

      - name: 保存工具链缓存
        if: success() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/android-sdk
            ~/dev/flutter
            ~/dev/jdk-17
            ~/dev/.downloads
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: 生成运行时 rootfs
        run: |
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a

      - name: 构建 APK（release 模式，暂用 debug 签名）
        run: |
          set -euo pipefail
          source tooling/env.sh
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          export PATH="$ANDROID_HOME/build-tools/$BT:$PATH"
          bash tooling/build-apk.sh -f arm64

      - name: 提取版本元数据并整理产物
        run: |
          set -euo pipefail
          source tooling/env.sh
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$APK"
          BADGING=$("$AAPT2" dump badging "$APK")
          VNAME=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          VCODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          test -n "$VNAME" && test -n "$VCODE"
          echo "versionName=$VNAME versionCode=$VCODE"
          python3 -c "import json,sys; json.dump({'versionName':sys.argv[1],'versionCode':int(sys.argv[2])}, open('version.json','w'))" "$VNAME" "$VCODE"
          cp "$APK" ./app-arm64-unsigned.apk

      - name: 上传构建产物给签名 job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-to-sign
          path: |
            ./app-arm64-unsigned.apk
            ./version.json
          retention-days: 1
          if-no-files-found: error

  sign:
    name: 自有密钥重签与校验
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-to-sign
          path: artifact

      - name: 产物初检
        run: |
          set -euo pipefail
          APK=artifact/app-arm64-unsigned.apk
          test -s "$APK"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); sys.exit('CRC 损坏: '+bad if bad else 0)" "$APK"
          python3 - <<'PY'
          import json, re
          d = json.load(open('artifact/version.json'))
          name = str(d.get('versionName', ''))
          code = d.get('versionCode')
          if not re.match(r'^\d+\.\d+\.\d+', name):
              raise SystemExit('versionName 异常: ' + name)
          if not isinstance(code, int) or isinstance(code, bool) or code <= 0:
              raise SystemExit('versionCode 异常: ' + repr(code))
          print('元数据自洽: %s (%s)' % (name, code))
          PY
          SZ=$(stat -c %s "$APK")
          MIN=$((60*1024*1024)); MAX=$((500*1024*1024))
          if [ "$SZ" -lt "$MIN" ] || [ "$SZ" -gt "$MAX" ]; then
            echo "APK 体积异常: $SZ 字节（期望 60–500 MiB），拒绝签名"; exit 1
          fi
          echo "初检通过: $SZ 字节"

      - name: 安装 apksigner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner zip
          apksigner version

      - name: 恢复自有签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then echo "缺少 RELEASE_KEYSTORE_B64（需在 fork 仓库配置）"; exit 1; fi
          mkdir -p keys && umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > keys/release.jks
          test -s keys/release.jks

      - name: 剥离 debug 签名并用自有密钥重签
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "缺少 RELEASE_STORE_PASSWORD 或 RELEASE_KEY_ALIAS"; exit 1; fi
          cp artifact/app-arm64-unsigned.apk keys/app.apk
          set +e
          zip -d keys/app.apk 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.MF' \
                             'META-INF/*.DSA' 'META-INF/*.EC'
          ZIP_RC=$?
          set -e
          if [ "$ZIP_RC" -ne 0 ] && [ "$ZIP_RC" -ne 12 ]; then
            echo "剥离旧 v1 签名失败（zip 退出码 $ZIP_RC），拒绝签名"; exit 1
          fi
          apksigner sign \
            --ks keys/release.jks \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            keys/app.apk
          cp keys/app.apk keys/dsh-go-signed-arm64.apk
          echo "重签完成"

      - name: 签名门禁校验
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          CERTS=$(apksigner verify -v --min-sdk-version 21 --print-certs keys/dsh-go-signed-arm64.apk)
          printf '%s\n' "$CERTS"
          for n in v1 v2 v3; do
            if ! printf '%s' "$CERTS" | grep -Eq "Verified using ${n} scheme.*: true"; then
              echo "${n} 签名未验证为 true，拒绝交付"; exit 1
            fi
          done
          if printf '%s' "$CERTS" | grep -qi 'CN=Android Debug'; then
            echo "签名仍是 Android Debug，拒绝交付"; exit 1
          fi
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            DIGESTS=$(printf '%s' "$CERTS" | grep -i 'SHA-256' | tr -d ' :')
            EXPECT=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr 'A-Z' 'a-z')
            if ! printf '%s' "$DIGESTS" | tr 'A-Z' 'a-z' | grep -q "$EXPECT"; then
              echo "证书 SHA-256 与固定值不一致，拒绝交付"; exit 1
            fi
            echo "证书 SHA-256 与固定值一致"
          else
            echo "::warning::未设置 RELEASE_CERT_SHA256 Variable，未做证书指纹固定校验"
          fi
          echo "签名校验通过：v1/v2/v3 均为 true，非 debug 证书"

      - name: 上传签名 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-go-signed-arm64
          path: keys/dsh-go-signed-arm64.apk
          retention-days: 7
          if-no-files-found: error
